<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siêu Clicker Pro - Bản Hoàn Hảo</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --accent-color: #f39c12;
            --text-color: #fff;
            --danger-color: #e74c3c;
            --success-color: #2ecc71;
            --info-color: #3498db;
            --youtube-color: #ff0000;
        }
        body {
            font-family: 'Press Start 2P', cursive;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            image-rendering: pixelated;
        }
        .game-wrapper {
            display: flex;
            gap: 15px;
            max-width: 900px;
            width: 100%;
            justify-content: center;
            align-items: flex-start;
            flex-wrap: wrap;
        }
        .game-container {
            width: 100%;
            max-width: 450px;
            background-color: var(--panel-bg);
            border: 4px solid #000;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 12px;
            box-sizing: border-box;
        }
        .side-panel {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .panel-box {
            background-color: var(--panel-bg);
            border: 4px solid #000;
            box-shadow: 8px 8px 0px rgba(0,0,0,0.6);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-sizing: border-box;
        }
        .panel-box h3 {
            font-size: 0.65rem;
            color: var(--accent-color);
            margin: 0;
            text-align: center;
            border-bottom: 2px dashed #555;
            padding-bottom: 6px;
        }
        header {
            text-align: center;
            border-bottom: 2px dashed #555;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            font-size: 0.85rem;
            color: var(--accent-color);
            margin: 0;
        }
        /* Nút mở Youtube */
        .yt-btn {
            background-color: var(--youtube-color);
            color: white;
            border: 2px solid #000;
            padding: 4px 8px;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.4rem;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            box-shadow: 2px 2px 0px #000;
        }
        .yt-btn:hover { background-color: #cc0000; }
        .yt-btn:active { transform: translateY(2px); box-shadow: none; }

        .stats-box {
            background: #000;
            border: 2px solid #444;
            padding: 10px;
            text-align: center;
            font-size: 0.65rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .stats-box span { color: var(--accent-color); }
        
        .clicker-area {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px 0;
        }
        #click-btn {
            width: 150px;
            height: 150px;
            background: #8e44ad;
            border: 4px solid #000;
            border-bottom: 8px solid #512e5f;
            border-radius: 50%;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            color: white;
            font-size: 2.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            user-select: none;
            transition: transform 0.05s;
            box-shadow: 0 4px 10px rgba(142, 68, 173, 0.4);
        }
        #click-btn:active {
            transform: scale(0.92) translateY(4px);
            border-bottom-width: 4px;
        }

        .shop-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 200px;
            overflow-y: auto;
            border-top: 2px dashed #444;
            padding-top: 8px;
        }
        .shop-item {
            background: #111;
            border: 2px solid #444;
            padding: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.5rem;
        }
        .shop-item div { display: flex; flex-direction: column; gap: 3px; }
        .shop-item span { color: #aaa; font-size: 0.4rem; }
        
        button.buy-btn, button.action-btn {
            font-family: 'Press Start 2P', cursive;
            background: var(--success-color);
            color: #000;
            border: none;
            border-bottom: 3px solid #1e8449;
            padding: 6px 8px;
            cursor: pointer;
            font-size: 0.45rem;
        }
        button.buy-btn:hover, button.action-btn:hover { background: #58d68d; }
        button.buy-btn:disabled, button.action-btn:disabled {
            background: #555;
            color: #888;
            border-bottom-color: #333;
            cursor: not-allowed;
        }

        /* Bảng Thành Tựu */
        .achievement-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            max-height: 200px;
            padding-right: 4px;
        }
        .ach-item {
            background: #111;
            border: 2px solid #444;
            padding: 6px;
            font-size: 0.4rem;
            display: flex;
            flex-direction: column;
            gap: 3px;
            opacity: 0.4;
        }
        .ach-item.unlocked {
            opacity: 1;
            border-color: var(--success-color);
            background: #152918;
        }
        .ach-item strong { color: var(--accent-color); }
        .ach-item.unlocked strong { color: var(--success-color); }

        /* Vùng Nhập Code Quà */
        .gift-box-area {
            display: flex;
            gap: 6px;
        }
        input.gift-input {
            font-family: 'Press Start 2P', cursive;
            background: #111;
            border: 2px solid #444;
            color: #fff;
            padding: 6px;
            font-size: 0.45rem;
            width: 100%;
            outline: none;
            text-transform: uppercase;
        }
        input.gift-input:focus { border-color: var(--accent-color); }

        /* Popup Thông Báo */
        #achievement-popup {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #000;
            border: 4px solid var(--accent-color);
            padding: 10px;
            width: 240px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            box-shadow: 5px 5px 0px rgba(0,0,0,0.8);
            transform: translateY(150px);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            font-size: 0.45rem;
        }
        #achievement-popup.show { transform: translateY(0); }
        #popup-title { color: var(--accent-color); font-weight: bold; }
        #popup-desc { color: #ccc; font-size: 0.4rem; }
    </style>
</head>
<body>

<div class="game-wrapper">
    <!-- CỘT CHÍNH (CLICKER & SHOP) -->
    <div class="game-container">
        <header>
            <h1>SIÊU CLICKER</h1>
            <a href="https://youtu.be/uAX3Csg3980?feature=shared" target="_blank" class="yt-btn">▶ Xem YT</a>
        </header>

        <div class="stats-box">
            <div>ĐIỂM SỐ: <span id="lbl-score">0</span></div>
            <div>TỰ ĐỘNG: <span id="lbl-pps">0</span> /s</div>
            <div>SỨC NHẤN: <span id="lbl-click-power">1</span> /click</div>
        </div>

        <div class="clicker-area">
            <button id="click-btn" onclick="handleClick(event)">🟣</button>
        </div>

        <div class="shop-section">
            <div class="shop-item">
                <div><strong>TĂNG SỨC NHẤN</strong><span>+1 Điểm/click (Giá: <span id="cost-click">15</span>)</span></div>
                <button class="buy-btn" id="btn-buy-click" onclick="buyUpgrade('click')">MUA</button>
            </div>
            <div class="shop-item">
                <div><strong>TỰ ĐỘNG I</strong><span>+1 Điểm/s (Giá: <span id="cost-auto1">50</span>)</span></div>
                <button class="buy-btn" id="btn-buy-auto1" onclick="buyUpgrade('auto1')">MUA</button>
            </div>
            <div class="shop-item">
                <div><strong>TỰ ĐỘNG II</strong><span>+8 Điểm/s (Giá: <span id="cost-auto2">300</span>)</span></div>
                <button class="buy-btn" id="btn-buy-auto2" onclick="buyUpgrade('auto2')">MUA</button>
            </div>
            <div class="shop-item">
                <div><strong>SIÊU TỰ ĐỘNG</strong><span>+40 Điểm/s (Giá: <span id="cost-auto3">1200</span>)</span></div>
                <button class="buy-btn" id="btn-buy-auto3" onclick="buyUpgrade('auto3')">MUA</button>
            </div>
        </div>
    </div>

    <!-- CỘT PHỤ (MÃ QUÀ & THÀNH TỰU) -->
    <div class="side-panel">
        <!-- NHẬP MÃ QUÀ TẶNG -->
        <div class="panel-box">
            <h3>NHẬP MÃ QUÀ (CODE)</h3>
            <div class="gift-box-area">
                <input type="text" id="gift-code-input" class="gift-input" placeholder="NHẬP CODE..." onkeydown="if(event.key==='Enter') redeemCode()">
                <button class="action-btn" onclick="redeemCode()" style="background: var(--info-color);">NHẬN</button>
            </div>
        </div>

        <!-- THÀNH TỰU -->
        <div class="panel-box">
            <h3>THÀNH TỰU (<span id="ach-count">0</span>/67)</h3>
            <div class="achievement-list" id="achievement-list-box"></div>
        </div>
    </div>
</div>

<!-- Popup Thông Báo -->
<div id="achievement-popup">
    <div style="color: #2ecc71;" id="popup-header">🏆 THÔNG BÁO!</div>
    <div id="popup-title">Tiêu đề</div>
    <div id="popup-desc">Mô tả</div>
</div>

<script>
    let game = {
        score: 0,
        totalScoreEarned: 0,
        totalClicks: 0,
        clickPower: 1,
        pps: 0,
        costs: { click: 15, auto1: 50, auto2: 300, auto3: 1200 },
        amounts: { click: 1, auto1: 0, auto2: 0, auto3: 0 },
        redeemedCodes: []
    };

    // Danh sách mã quà tặng
    const validCodes = {
        "CLICKPRO": { score: 500, title: "Mã Khởi Đầu", desc: "Nhận ngay 500 điểm miễn phí!" },
        "FREEMONEY": { score: 2000, title: "Mã Đại Gia", desc: "Nhận ngay 2000 điểm cực ngon!" }
    };

    // Hệ thống 67 Thành Tựu
    const achievementsData = [];
    for (let i = 1; i <= 25; i++) {
        let target = Math.floor(Math.pow(1.8, i) * 50);
        achievementsData.push({ id: `score_${i}`, title: `Đại Gia Số ${i}`, desc: `Đạt tổng ${target.toLocaleString()} điểm.`, check: () => game.totalScoreEarned >= target, unlocked: false });
    }
    for (let i = 1; i <= 20; i++) {
        let target = i * 25;
        achievementsData.push({ id: `click_${i}`, title: `Nát Chuột ${i}`, desc: `Click tổng cộng ${target} lần.`, check: () => game.totalClicks >= target, unlocked: false });
    }
    for (let i = 1; i <= 22; i++) {
        let target = i * 5;
        achievementsData.push({ id: `asset_${i}`, title: `Đế Chế ${i}`, desc: `Sở hữu ${target} nâng cấp tự động.`, check: () => (game.amounts.auto1 + game.amounts.auto2 + game.amounts.auto3) >= target, unlocked: false });
    }

    function initAchievementsUI() {
        const listContainer = document.getElementById('achievement-list-box');
        listContainer.innerHTML = '';
        achievementsData.forEach(ach => {
            let div = document.createElement('div');
            div.className = 'ach-item';
            div.id = `ach-ui-${ach.id}`;
            div.innerHTML = `<strong>${ach.title}</strong><span>${ach.desc}</span>`;
            listContainer.appendChild(div);
        });
    }

    function redeemCode() {
        let codeInput = document.getElementById('gift-code-input');
        let code = codeInput.value.trim().toUpperCase();
        
        if (!code) return;

        if (game.redeemedCodes.includes(code)) {
            showPopup("LỖI", "Mã quà này đã được sử dụng rồi!", "#e74c3c");
            return;
        }

        if (validCodes[code]) {
            let reward = validCodes[code];
            if (reward.score) { game.score += reward.score; game.totalScoreEarned += reward.score; }
            
            game.redeemedCodes.push(code);
            codeInput.value = "";
            saveGame();
            updateUI();
            checkAchievements();
            showPopup("THÀNH CÔNG!", reward.desc, "#2ecc71");
        } else {
            showPopup("THẤT BẠI", "Mã quà không hợp lệ!", "#e74c3c");
        }
    }

    function handleClick(e) {
        game.score += game.clickPower;
        game.totalScoreEarned += game.clickPower;
        game.totalClicks++;

        updateUI();
        checkAchievements();
        showFloatingText(e.clientX, e.clientY, `+${game.clickPower}`);
    }

    function showFloatingText(x, y, text) {
        let el = document.createElement('div');
        el.innerText = text;
        el.style.position = 'fixed';
        el.style.left = x + 'px';
        el.style.top = (y - 20) + 'px';
        el.style.fontFamily = "'Press Start 2P', cursive";
        el.style.fontSize = '0.55rem';
        el.style.color = '#f39c12';
        el.style.pointerEvents = 'none';
        el.style.transition = 'all 0.5s ease-out';
        document.body.appendChild(el);
        setTimeout(() => { el.style.transform = 'translateY(-30px)'; el.style.opacity = '0'; }, 20);
        setTimeout(() => el.remove(), 500);
    }

    function buyUpgrade(type) {
        if (game.score >= game.costs[type]) {
            game.score -= game.costs[type];
            if (type === 'click') {
                game.clickPower += 1;
                game.costs.click = Math.floor(game.costs.click * 1.5);
            } else if (type === 'auto1') {
                game.amounts.auto1++;
                game.pps += 1;
                game.costs.auto1 = Math.floor(game.costs.auto1 * 1.4);
            } else if (type === 'auto2') {
                game.amounts.auto2++;
                game.pps += 8;
                game.costs.auto2 = Math.floor(game.costs.auto2 * 1.4);
            } else if (type === 'auto3') {
                game.amounts.auto3++;
                game.pps += 40;
                game.costs.auto3 = Math.floor(game.costs.auto3 * 1.4);
            }
            updateUI();
            checkAchievements();
        }
    }

    let popupQueue = [];
    let isShowingPopup = false;

    function showPopup(headerText, descText, borderColor = '#f39c12') {
        popupQueue.push({ header: headerText, desc: descText, border: borderColor });
        processPopupQueue();
    }

    function processPopupQueue() {
        if (isShowingPopup || popupQueue.length === 0) return;
        isShowingPopup = true;
        let item = popupQueue.shift();

        let popup = document.getElementById('achievement-popup');
        popup.style.borderColor = item.border;
        document.getElementById('popup-header').innerText = item.header;
        document.getElementById('popup-title').innerText = "";
        document.getElementById('popup-desc').innerText = item.desc;
        popup.classList.add('show');

        setTimeout(() => {
            popup.classList.remove('show');
            setTimeout(() => {
                isShowingPopup = false;
                processPopupQueue();
            }, 300);
        }, 2500);
    }

    function checkAchievements() {
        let unlockedCount = 0;
        achievementsData.forEach(ach => {
            if (!ach.unlocked && ach.check()) {
                ach.unlocked = true;
                showPopup("🏆 THÀNH TỰU!", `${ach.title}\n${ach.desc}`, "#2ecc71");
                let uiEl = document.getElementById(`ach-ui-${ach.id}`);
                if (uiEl) uiEl.classList.add('unlocked');
            }
            if (ach.unlocked) unlockedCount++;
        });
        document.getElementById('ach-count').innerText = unlockedCount;
    }

    // Lưu tiến trình tự động
    function saveGame() {
        localStorage.setItem('sieu_clicker_save', JSON.stringify(game));
    }

    function loadGame() {
        let savedData = localStorage.getItem('sieu_clicker_save');
        if (savedData) {
            try {
                let parsed = JSON.parse(savedData);
                game = Object.assign({}, game, parsed);
                achievementsData.forEach(ach => {
                    if (ach.check()) {
                        ach.unlocked = true;
                        let uiEl = document.getElementById(`ach-ui-${ach.id}`);
                        if (uiEl) uiEl.classList.add('unlocked');
                    }
                });
            } catch (e) {
                console.error("Lỗi tải tiến trình:", e);
            }
        }
    }

    // Vòng lặp game loop mỗi giây
    setInterval(() => {
        if (game.pps > 0) {
            game.score += game.pps;
            game.totalScoreEarned += game.pps;
        }
        updateUI();
        checkAchievements();
        saveGame();
    }, 1000);

    function updateUI() {
        document.getElementById('lbl-score').innerText = Math.floor(game.score);
        document.getElementById('lbl-pps').innerText = game.pps;
        document.getElementById('lbl-click-power').innerText = game.clickPower;

        document.getElementById('cost-click').innerText = game.costs.click;
        document.getElementById('cost-auto1').innerText = game.costs.auto1;
        document.getElementById('cost-auto2').innerText = game.costs.auto2;
        document.getElementById('cost-auto3').innerText = game.costs.auto3;

        document.getElementById('btn-buy-click').disabled = game.score < game.costs.click;
        document.getElementById('btn-buy-auto1').disabled = game.score < game.costs.auto1;
        document.getElementById('btn-buy-auto2').disabled = game.score < game.costs.auto2;
        document.getElementById('btn-buy-auto3').disabled = game.score < game.costs.auto3;
    }

    // Khởi chạy khi tải trang
    initAchievementsUI();
    loadGame();
    updateUI();
</script>

</body>
</html>
