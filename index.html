<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>God Simulator: WorldBox Ultimate Edition (400$ CTO Build)</title>
    <style>
        :root {
            --bg-main: #030712;
            --bg-panel: #0f172a;
            --bg-card: #1e293b;
            --accent-gold: #f59e0b;
            --accent-cyan: #06b6d4;
            --accent-pink: #f43f5e;
            --success: #10b981;
            --danger: #ef4444;
            --text-light: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background: var(--bg-main);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 8px;
        }

        .god-wrapper {
            width: 100%;
            max-width: 1280px;
            background: var(--bg-panel);
            border: 2px solid var(--accent-gold);
            border-radius: 16px;
            box-shadow: 0 0 40px rgba(245, 158, 11, 0.25);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 97vh;
        }

        header {
            background: linear-gradient(90deg, #18181b, #27272a);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
        }

        header h1 {
            font-size: 20px;
            background: linear-gradient(90deg, var(--accent-gold), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            font-weight: 900;
            letter-spacing: 1.5px;
        }

        .world-stats {
            display: flex;
            gap: 18px;
            font-size: 12px;
            color: var(--text-dim);
        }

        .world-stats span {
            color: var(--success);
            font-weight: bold;
        }

        .main-layout {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
        }

        /* Sidebar công cụ Thượng Đế */
        sidebar {
            width: 290px;
            background: var(--bg-panel);
            border-right: 2px solid var(--border);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            overflow-y: auto;
        }

        .tool-group {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px;
        }

        .tool-group h3 {
            font-size: 11px;
            color: var(--accent-gold);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tool-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }

        .btn-tool {
            background: var(--bg-main);
            border: 1px solid var(--border);
            color: var(--text-light);
            padding: 8px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }

        .btn-tool:hover {
            border-color: var(--accent-cyan);
            background: rgba(6, 182, 212, 0.1);
        }

        .btn-tool.active {
            background: var(--accent-gold);
            color: #000;
            border-color: var(--accent-gold);
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.4);
        }

        /* Canvas hiển thị thế giới */
        .canvas-container {
            flex-grow: 1;
            background: #020617;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        canvas {
            border: 2px solid var(--border);
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
            cursor: crosshair;
            background: #090d16;
        }

        /* Chân trang điều khiển thời gian & thông báo */
        .control-footer {
            background: #090d16;
            padding: 10px 15px;
            border-top: 2px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .simulation-controls {
            display: flex;
            gap: 8px;
        }

        .btn-sim {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-light);
            padding: 6px 14px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-sim:hover {
            background: var(--border);
        }

        .btn-sim.danger {
            background: rgba(239, 68, 68, 0.2);
            border-color: var(--danger);
            color: var(--danger);
        }

        .log-screen {
            font-family: 'Courier New', Courier, monospace;
            font-size: 11px;
            color: var(--accent-cyan);
            background: #000;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            width: 480px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body>

<div class="god-wrapper">
    <header>
        <h1>🌍 WorldBox: Ultimate Civilization (400$ CTO Build)</h1>
        <div class="world-stats">
            <div>Dân số: <span id="popCount">0</span></div>
            <div>Thành quách: <span id="villageCount">0</span></div>
            <div>Dã thú: <span id="beastCount">0</span></div>
            <div>Kỷ nguyên: <span id="yearCount">Đồ Đá (Năm 1)</span></div>
        </div>
    </header>

    <div class="main-layout">
        <!-- Bảng điều khiển quyền năng -->
        <sidebar>
            <div class="tool-group">
                <h3>🏞️ Kiến Tạo Địa Hình</h3>
                <div class="tool-grid">
                    <button class="btn-tool active" onclick="setTool('land', this)">Đất Liền</button>
                    <button class="btn-tool" onclick="setTool('water', this)">Đại Dương</button>
                    <button class="btn-tool" onclick="setTool('forest', this)">Rừng Rậm</button>
                    <button class="btn-tool" onclick="setTool('mountain', this)">Dãy Núi</button>
                    <button class="btn-tool" onclick="setTool('gold', this)">Mỏ Khoáng</button>
                    <button class="btn-tool" onclick="setTool('erase', this)">Tẩy Xóa</button>
                </div>
            </div>

            <div class="tool-group">
                <h3>👥 Khởi Tạo Chủng Tộc</h3>
                <div class="tool-grid">
                    <button class="btn-tool" onclick="setTool('human', this)">Loài Người</button>
                    <button class="btn-tool" onclick="setTool('orc', this)">Tộc Orc</button>
                    <button class="btn-tool" onclick="setTool('elf', this)">Tộc Elf</button>
                    <button class="btn-tool" onclick="setTool('wolf', this)">Sói Hoang</button>
                </div>
            </div>

            <div class="tool-group">
                <h3>⚡ Thiên Tai & Phép Thuật</h3>
                <div class="tool-grid">
                    <button class="btn-tool" onclick="setTool('lightning', this)">Sét Giáng Thế</button>
                    <button class="btn-tool" onclick="setTool('meteor', this)">Thiên Thạch</button>
                    <button class="btn-tool" onclick="setTool('fire', this)">Đám Cháy</button>
                    <button class="btn-tool" onclick="setTool('blessed', this)">Đất Màu Mỡ</button>
                </div>
            </div>

            <div class="tool-group">
                <h3>⚙️ Quản Trị Hệ Thống</h3>
                <div class="tool-grid">
                    <button class="btn-tool" onclick="saveWorld()">Lưu Thế Giới</button>
                    <button class="btn-tool" onclick="loadWorld()">Tải Dữ Liệu</button>
                    <button class="btn-tool" style="grid-column: span 2; color: var(--danger); border-color: var(--danger);" onclick="resetWorld()">Hủy Diệt Toàn Cục</button>
                </div>
            </div>
        </sidebar>

        <!-- Canvas Thế Giới -->
        <div class="canvas-container" id="canvasContainer">
            <canvas id="worldCanvas" width="750" height="520"></canvas>
        </div>
    </div>

    <!-- Thanh footer điều khiển -->
    <div class="control-footer">
        <div class="simulation-controls">
            <button class="btn-sim" onclick="togglePause()" id="pauseBtn">⏸️ Tạm Dừng</button>
            <button class="btn-sim" onclick="changeSpeed(1)">1x</button>
            <button class="btn-sim" onclick="changeSpeed(2)">2x</button>
            <button class="btn-sim danger" onclick="clearDisasters()">Dập Lửa</button>
        </div>
        <div class="log-screen" id="logScreen">
            [CTO System]: Khởi tạo thành công không gian WorldBox tối thượng dưới quyền cai quản của Sếp.
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById("worldCanvas");
    const ctx = canvas.getContext("2d");

    const CELL_SIZE = 10;
    const COLS = canvas.width / CELL_SIZE; // 75
    const ROWS = canvas.height / CELL_SIZE; // 52

    const TILE_EMPTY = 0;
    const TILE_LAND = 1;
    const TILE_WATER = 2;
    const TILE_FOREST = 3;
    const TILE_MOUNTAIN = 4;
    const TILE_GOLD = 5;
    const TILE_FIRE = 6;
    const TILE_BUILDING = 7;

    let worldGrid = [];
    let entities = [];
    let villages = [];

    let currentTool = 'land';
    let isPaused = false;
    let gameYear = 1;
    let yearCounter = 0;

    function initWorld() {
        worldGrid = [];
        for (let y = 0; y < ROWS; y++) {
            let row = [];
            for (let x = 0; x < COLS; x++) {
                let type = (Math.random() < 0.18) ? TILE_WATER : ((Math.random() < 0.1) ? TILE_FOREST : TILE_EMPTY);
                row.push(type);
            }
            worldGrid.push(row);
        }
        entities = [];
        villages = [];
        gameYear = 1;
        updateLog("Đã thiết lập lại cấu trúc kiến tạo nguyên thủy.");
    }

    function setTool(toolName, btnElement) {
        currentTool = toolName;
        document.querySelectorAll('.btn-tool').forEach(b => b.classList.remove('active'));
        if (btnElement) btnElement.classList.add('active');
        updateLog(`Đã chuyển quyền năng sang: [${toolName.toUpperCase()}]`);
    }

    function updateLog(msg) {
        document.getElementById("logScreen").innerText = `[CTO Log]: ${msg}`;
    }

    let isMouseDown = false;
    canvas.addEventListener("mousedown", (e) => { isMouseDown = true; applyToolAtEvent(e); });
    window.addEventListener("mouseup", () => { isMouseDown = false; });
    canvas.addEventListener("mousemove", (e) => { if (isMouseDown) applyToolAtEvent(e); });

    function applyToolAtEvent(e) {
        const rect = canvas.getBoundingClientRect();
        const mouseX = Math.floor((e.clientX - rect.left) / CELL_SIZE);
        const mouseY = Math.floor((e.clientY - rect.top) / CELL_SIZE);
        if (mouseX >= 0 && mouseX < COLS && mouseY >= 0 && mouseY < ROWS) {
            applyGodTool(mouseX, mouseY);
        }
    }

    function applyGodTool(x, y) {
        switch(currentTool) {
            case 'land': worldGrid[y][x] = TILE_LAND; break;
            case 'water': worldGrid[y][x] = TILE_WATER; break;
            case 'forest': worldGrid[y][x] = TILE_FOREST; break;
            case 'mountain': worldGrid[y][x] = TILE_MOUNTAIN; break;
            case 'gold': worldGrid[y][x] = TILE_GOLD; break;
            case 'erase': worldGrid[y][x] = TILE_EMPTY; break;
            case 'human': spawnEntity(x, y, 'human', 'Loài Người'); isMouseDown = false; break;
            case 'orc': spawnEntity(x, y, 'orc', 'Tộc Orc'); isMouseDown = false; break;
            case 'elf': spawnEntity(x, y, 'elf', 'Tộc Elf'); isMouseDown = false; break;
            case 'wolf': spawnEntity(x, y, 'wolf', 'Sói Hoang'); isMouseDown = false; break;
            case 'lightning': strikeLightning(x, y); isMouseDown = false; break;
            case 'meteor': dropMeteor(x, y); isMouseDown = false; break;
            case 'fire': worldGrid[y][x] = TILE_FIRE; break;
            case 'blessed': blessLand(x, y); break;
        }
    }

    function spawnEntity(x, y, type, name) {
        entities.push({
            x: x, y: y, type: type, name: name, hp: 120, age: 0,
            hasBuilding: false
        });
        updateLog(`Ban sinh khí cho [${name}] tại vị trí (${x}, ${y}).`);
    }

    function strikeLightning(x, y) {
        worldGrid[y][x] = TILE_FIRE;
        updateLog(`⚡ Sét đánh trực diện tại (${x}, ${y})!`);
        entities = entities.filter(ent => {
            if (Math.abs(ent.x - x) <= 2 && Math.abs(ent.y - y) <= 2) ent.hp -= 90;
            return ent.hp > 0;
        });
    }

    function dropMeteor(x, y) {
        updateLog(`☄️ Thiên thạch hủy diệt giáng xuống (${x}, ${y})!`);
        for (let dy = -3; dy <= 3; dy++) {
            for (let dx = -3; dx <= 3; dx++) {
                let nx = x + dx, ny = y + dy;
                if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                    worldGrid[ny][nx] = Math.random() < 0.6 ? TILE_MOUNTAIN : TILE_FIRE;
                }
            }
        }
        entities = entities.filter(ent => Math.abs(ent.x - x) > 3 || Math.abs(ent.y - y) > 3);
    }

    function blessLand(x, y) {
        for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
                let nx = x + dx, ny = y + dy;
                if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                    if (worldGrid[ny][nx] === TILE_EMPTY || worldGrid[ny][nx] === TILE_LAND) {
                        worldGrid[ny][nx] = TILE_FOREST;
                    }
                }
            }
        }
    }

    function updateSimulation() {
        if (isPaused) return;

        yearCounter++;
        if (yearCounter > 40) {
            gameYear++;
            yearCounter = 0;
        }

        // Lan truyền lửa
        for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
                if (worldGrid[y][x] === TILE_FIRE) {
                    if (Math.random() < 0.35) worldGrid[y][x] = TILE_EMPTY;
                    let dirs = [[0,1],[0,-1],[1,0],[-1,0]];
                    let d = dirs[Math.floor(Math.random() * dirs.length)];
                    let nx = x + d[0], ny = y + d[1];
                    if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                        if (worldGrid[ny][nx] === TILE_FOREST || worldGrid[ny][nx] === TILE_LAND || worldGrid[ny][nx] === TILE_BUILDING) {
                            worldGrid[ny][nx] = TILE_FIRE;
                        }
                    }
                }
            }
        }

        // Cập nhật sinh vật & xây dựng thành quách
        entities.forEach(ent => {
            ent.age++;
            let moves = [[0,1], [0,-1], [1,0], [-1,0], [0,0]];
            let m = moves[Math.floor(Math.random() * moves.length)];
            let nx = ent.x + m[0], ny = ent.y + m[1];

            if (nx >= 0 && nx < COLS && ny >= 0 && ny < ROWS) {
                if (worldGrid[ny][nx] !== TILE_WATER && worldGrid[ny][nx] !== TILE_MOUNTAIN) {
                    ent.x = nx;
                    ent.y = ny;
                }
                if (worldGrid[ny][nx] === TILE_FIRE) ent.hp -= 25;
                
                // Xây dựng làng mạc nếu đứng trên đất trống / rừng
                if (!ent.hasBuilding && ent.type !== 'wolf' && (worldGrid[ny][nx] === TILE_LAND || worldGrid[ny][nx] === TILE_FOREST)) {
                    if (Math.random() < 0.05) {
                        worldGrid[ny][nx] = TILE_BUILDING;
                        ent.hasBuilding = true;
                        villages.push({x: nx, y: ny, owner: ent.type});
                    }
                }
            }

            // Giao tranh giữa các loài khác nhau
            entities.forEach(other => {
                if (ent !== other && ent.x === other.x && ent.y === other.y) {
                    if (ent.type !== other.type && ent.type !== 'wolf' && other.type !== 'wolf') {
                        other.hp -= 15;
                    }
                }
            });
        });

        entities = entities.filter(ent => ent.hp > 0 && ent.age < 2000);

        renderWorld();
        updateUIStats();
    }

    function renderWorld() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
                let tile = worldGrid[y][x];
                switch(tile) {
                    case TILE_EMPTY: ctx.fillStyle = "#090d16"; break;
                    case TILE_LAND: ctx.fillStyle = "#334155"; break;
                    case TILE_WATER: ctx.fillStyle = "#0284c7"; break;
                    case TILE_FOREST: ctx.fillStyle = "#15803d"; break;
                    case TILE_MOUNTAIN: ctx.fillStyle = "#475569"; break;
                    case TILE_GOLD: ctx.fillStyle = "#ca8a04"; break;
                    case TILE_FIRE: ctx.fillStyle = "#dc2626"; break;
                    case TILE_BUILDING: ctx.fillStyle = "#d97706"; break;
                    default: ctx.fillStyle = "#090d16";
                }
                ctx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            }
        }

        entities.forEach(ent => {
            ctx.beginPath();
            let px = ent.x * CELL_SIZE + CELL_SIZE / 2;
            let py = ent.y * CELL_SIZE + CELL_SIZE / 2;
            ctx.arc(px, py, CELL_SIZE / 2 - 1, 0, Math.PI * 2);

            if (ent.type === 'human') ctx.fillStyle = "#38bdf8";
            else if (ent.type === 'orc') ctx.fillStyle = "#ea580c";
            else if (ent.type === 'elf') ctx.fillStyle = "#c084fc";
            else if (ent.type === 'wolf') ctx.fillStyle = "#94a3b8";

            ctx.fill();
            ctx.lineWidth = 1;
            ctx.strokeStyle = "#fff";
            ctx.stroke();
        });
    }

    function updateUIStats() {
        document.getElementById("popCount").innerText = entities.length;
        document.getElementById("villageCount").innerText = villages.length;
        document.getElementById("beastCount").innerText = entities.filter(e => e.type === 'wolf').length;
        
        let era = "Đồ Đá";
        if (gameYear > 10) era = "Đồ Đồng";
        if (gameYear > 25) era = "Đồ Sắt";
        if (gameYear > 50) era = "Kỷ Nguyên Vàng";
        document.getElementById("yearCount").innerText = `${era} (Năm ${gameYear})`;
    }

    function togglePause() {
        isPaused = !isPaused;
        document.getElementById("pauseBtn").innerText = isPaused ? "▶️ Tiếp Tục" : "⏸️ Tạm Dừng";
        updateLog(isPaused ? "Đã tạm dừng tiến trình thời gian." : "Đã tiếp tục tiến trình thời gian.");
    }

    function changeSpeed(spd) {
        updateLog(`Đã điều chỉnh nhịp độ dòng chảy thời gian.`);
    }

    function clearDisasters() {
        for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
                if (worldGrid[y][x] === TILE_FIRE) worldGrid[y][x] = TILE_EMPTY;
            }
        }
        updateLog("Đã dập tắt toàn bộ đám cháy hỏa hoạn.");
    }

    function resetWorld() {
        if (confirm("Sếp có chắc chắn muốn kích hoạt giao thức Hủy Diệt Toàn Cục không?")) {
            initWorld();
            updateLog("⚠️ Thượng Đế đã xóa sổ thế giới cũ và tái tạo không gian mới.");
        }
    }

    function saveWorld() {
        try {
            const saveObj = { grid: worldGrid, ents: entities, vills: villages, yr: gameYear };
            localStorage.setItem("WorldBox_Ultimate_Save", JSON.stringify(saveObj));
            updateLog("💾 Đã lưu tiến trình thế giới vào localStorage.");
        } catch (e) {
            updateLog(`Lỗi lưu game: ${e.message}`);
        }
    }

    function loadWorld() {
        try {
            const data = localStorage.getItem("WorldBox_Ultimate_Save");
            if (data) {
                const parsed = JSON.parse(data);
                worldGrid = parsed.grid;
                entities = parsed.ents;
                villages = parsed.vills || [];
                gameYear = parsed.yr || 1;
                updateLog("📂 Khôi phục thành công dữ liệu thế giới đã lưu.");
            } else {
                updateLog("Không tìm thấy tệp lưu trữ dữ liệu nào.");
            }
        } catch (e) {
            updateLog(`Lỗi tải dữ liệu: ${e.message}`);
        }
    }

    initWorld();
    setInterval(updateSimulation, 130);
</script>

</body>
</html>
