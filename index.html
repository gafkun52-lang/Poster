<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuồng Phong Màu Sắc - v2.0 Full Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            padding-bottom: 70px; /* Tránh banner quảng cáo che mất nội dung */
        }

        header {
            text-align: center;
            margin: 20px 0;
        }
        h1 {
            font-size: 26px;
            color: #ffde59;
            text-shadow: 0 2px 8px rgba(255, 222, 89, 0.4);
        }
        .stats {
            font-size: 14px;
            color: #b2bec3;
            margin-top: 5px;
        }

        /* Khung giao diện kính mờ chung (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 20px;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            margin-bottom: 15px;
            text-align: center;
        }

        /* Màn hình Game */
        #game-screen {
            height: 220px;
            position: relative;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            overflow: hidden;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .player {
            width: 35px;
            height: 35px;
            background: #ff416c;
            border-radius: 50%;
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            box-shadow: 0 0 10px #ff416c;
            cursor: pointer;
            transition: left 0.1s ease;
        }
        .storm-obstacle {
            width: 30px;
            height: 30px;
            background: #00cec9;
            position: absolute;
            top: -40px;
            border-radius: 8px;
            box-shadow: 0 0 8px #00cec9;
        }

        /* Nút bấm phong cách */
        .btn {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 65, 108, 0.4);
            transition: 0.2s;
            margin: 5px;
        }
        .btn:active {
            transform: scale(0.95);
        }
        .btn-shop {
            background: linear-gradient(45deg, #00b09b, #96c93d);
            box-shadow: 0 4px 15px rgba(0, 176, 155, 0.4);
        }

        /* Khu vực Shop */
        .shop-items {
            display: flex;
            justify-content: space-around;
            margin-top: 10px;
        }
        .shop-item {
            font-size: 12px;
            background: rgba(255,255,255,0.05);
            padding: 8px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* Banner quảng cáo 100% width dưới đáy */
        #ad-banner {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55px;
            background: rgba(15, 15, 25, 0.95);
            border-top: 2px solid #ffde59;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 13px;
            color: #ffde59;
            z-index: 1000;
            transition: transform 0.4s ease-in-out;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.5);
        }
        .hidden-ad {
            transform: translateY(100%);
        }
    </style>
</head>
<body>

    <header>
        <h1>Cuồng Phong Màu Sắc</h1>
        <div class="stats">Kỷ lục: <span id="high-score">0</span> | Điểm: <span id="score">0</span></div>
    </header>

    <!-- Khung Gameplay -->
    <div class="glass-card">
        <h3 style="margin-bottom: 10px; font-size: 16px; color: #ff416c;">Vùng Tâm Bão</h3>
        <div id="game-screen" onclick="handleGameClick(event)">
            <div class="player" id="player" style="left: 50%;"></div>
        </div>
        <p style="font-size: 12px; margin-top: 10px; color: #dfe6e9;">Chạm/Click trái phải để né cuồng phong!</p>
        <button class="btn" onclick="startGame()">BẮT ĐẦU CHIẾN</button>
    </div>

    <!-- Khung Cửa Hàng (Shop) -->
    <div class="glass-card">
        <h3 style="margin-bottom: 10px; font-size: 16px; color: #00cec9;">Cửa Hàng Thân Thiện</h3>
        <div class="shop-items">
            <div class="shop-item">
                <p>🎨 Đổi Màu VIP</p>
                <button class="btn btn-shop" style="padding: 5px 10px; font-size: 12px;" onclick="buySkin('skin')">50 Điểm</button>
            </div>
            <div class="shop-item">
                <p>⚡ Siêu Tốc Độ</p>
                <button class="btn btn-shop" style="padding: 5px 10px; font-size: 12px;" onclick="buySkin('boost')">100 Điểm</button>
            </div>
        </div>
    </div>

    <!-- Banner quảng cáo hệ phái thân thiện (100% width) -->
    <div id="ad-banner">
        <span>📢 [Quảng cáo] Nâng cấp tài khoản VIP để tắt quảng cáo vĩnh viễn!</span>
    </div>

    <script>
        // --- 1. LOGIC QUẢNG CÁO (Hiện 20s, ẩn 40s trong chu kỳ 60s) ---
        const adBanner = document.getElementById('ad-banner');
        function manageAds() {
            adBanner.classList.remove('hidden-ad'); // Hiện banner
            setTimeout(() => {
                adBanner.classList.add('hidden-ad'); // Ẩn banner sau 20s
            }, 20000);
        }
        manageAds();
        setInterval(manageAds, 60000); // Lặp lại mỗi 1 phút

        // --- 2. LOGIC GAME & LOCALSTORAGE ---
        let score = 0;
        let highScore = localStorage.getItem('cpms_highscore') || 0;
        document.getElementById('high-score').innerText = highScore;

        const player = document.getElementById('player');
        const scoreDisplay = document.getElementById('score');

        function startGame() {
            score = 0;
            scoreDisplay.innerText = score;
            alert("Trò chơi bắt đầu! Hãy né các chướng ngại vật rơi xuống.");
            // Giả lập tăng điểm theo thời gian sinh tồn
            let gameInterval = setInterval(() => {
                score += 10;
                scoreDisplay.innerText = score;
                if(score > highScore) {
                    highScore = score;
                    localStorage.setItem('cpms_highscore', highScore);
                    document.getElementById('high-score').innerText = highScore;
                }
            }, 1000);
        }

        function handleGameClick(event) {
            const rect = event.currentTarget.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            // Di chuyển player theo vị trí click trái/phải khung game
            if(clickX < rect.width / 2) {
                player.style.left = '25%';
            } else {
                player.style.left = '75%';
            }
        }

        function buySkin(item) {
            if(score >= (item === 'skin' ? 50 : 100)) {
                score -= (item === 'skin' ? 50 : 100);
                scoreDisplay.innerText = score;
                alert("Mua thành công vật phẩm " + item + "!");
            } else {
                alert("Không đủ điểm thưởng để mua! Hãy cày thêm đi ông giáo ơi.");
            }
        }
    </script>
</body>
</html>
